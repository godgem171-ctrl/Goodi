name: E2E Puppeteer

on:
  push:
    branches: [ "chore/update-deps", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          nohup npm run start &
          echo "Waiting for server to start..."
          sleep 6

      - name: Run Puppeteer checks
        run: node scripts/puppeteer-check.js

      - name: Archive logs
        if: failure()
        run: |
          echo "--- Server logs ---"
          tail -n 200 /tmp/movieverse_start.log || true
